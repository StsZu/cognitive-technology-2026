<!doctype html>
<html lang="uk" dir="ltr">
<head>
<meta charset="utf-8">
<!--
  Offline quiz page template, Material Design 3 look. Single source of the quiz CSS and JS.
  Build: python3 tools/build_quiz.py <data.json> -o <out.html> [--lang uk] [--title "..."]

  Placeholders (named here without their delimiters so this comment is never substituted):
    LANG, DIR           in double curly braces: html lang / dir attributes
    TITLE               in double curly braces: <title> and <h1> (HTML-escaped)
    DESCRIPTION         in double curly braces: meta description and subtitle (HTML-escaped, may be empty)
    QUIZ_DATA           in double underscores: JSON array of questions inside script#quiz-data
    UI_STRINGS          in double underscores: JSON object of UI strings inside script#quiz-strings
  JSON values escape the characters < > & and the line/paragraph separators as 6-character \u escapes (\u003c, \u003e, \u0026, \u2028, \u2029).
  All UI text comes from quiz-strings; the markup below contains no language-specific text.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Перевірте, як ви зрозуміли дві опори впровадження: людину і технології">
<title>Когнітивні технології: концепція впровадження</title>
<style>
:root {
  color-scheme: light dark;
  --md-sys-color-primary: #0b57d0;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #d3e3fd;
  --md-sys-color-on-primary-container: #041e49;
  --md-sys-color-secondary: #565e71;
  --md-sys-color-secondary-container: #dae2f9;
  --md-sys-color-on-secondary-container: #131c2b;
  --md-sys-color-surface: #f8f9ff;
  --md-sys-color-surface-container-low: #f3f4fa;
  --md-sys-color-surface-container: #edeef4;
  --md-sys-color-surface-container-high: #e7e8ee;
  --md-sys-color-on-surface: #1a1b21;
  --md-sys-color-on-surface-variant: #44474f;
  --md-sys-color-outline: #74777f;
  --md-sys-color-outline-variant: #c4c6d0;
  --md-sys-color-error: #ba1a1a;
  --md-sys-color-on-error: #ffffff;
  --md-sys-color-error-container: #ffdad6;
  --md-sys-color-on-error-container: #410002;
  --md-sys-color-success: #146c2e;
  --md-sys-color-success-container: #a6f2b5;
  --md-sys-color-on-success-container: #002109;

  --md-ref-typeface: Roboto, "Roboto Flex", system-ui, -apple-system, "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --md-sys-typescale-display-small-size: 36px;
  --md-sys-typescale-display-small-line-height: 44px;
  --md-sys-typescale-display-small-weight: 400;
  --md-sys-typescale-display-small-tracking: 0;
  --md-sys-typescale-headline-small-size: 24px;
  --md-sys-typescale-headline-small-line-height: 32px;
  --md-sys-typescale-headline-small-weight: 400;
  --md-sys-typescale-headline-small-tracking: 0;
  --md-sys-typescale-title-large-size: 22px;
  --md-sys-typescale-title-large-line-height: 28px;
  --md-sys-typescale-title-large-weight: 400;
  --md-sys-typescale-title-large-tracking: 0;
  --md-sys-typescale-title-medium-size: 16px;
  --md-sys-typescale-title-medium-line-height: 24px;
  --md-sys-typescale-title-medium-weight: 500;
  --md-sys-typescale-title-medium-tracking: 0.15px;
  --md-sys-typescale-body-large-size: 16px;
  --md-sys-typescale-body-large-line-height: 24px;
  --md-sys-typescale-body-large-weight: 400;
  --md-sys-typescale-body-large-tracking: 0.5px;
  --md-sys-typescale-body-medium-size: 14px;
  --md-sys-typescale-body-medium-line-height: 20px;
  --md-sys-typescale-body-medium-weight: 400;
  --md-sys-typescale-body-medium-tracking: 0.25px;
  --md-sys-typescale-label-large-size: 14px;
  --md-sys-typescale-label-large-line-height: 20px;
  --md-sys-typescale-label-large-weight: 500;
  --md-sys-typescale-label-large-tracking: 0.1px;
  --md-sys-typescale-label-medium-size: 12px;
  --md-sys-typescale-label-medium-line-height: 16px;
  --md-sys-typescale-label-medium-weight: 500;
  --md-sys-typescale-label-medium-tracking: 0.5px;
  --md-sys-typescale-label-small-size: 11px;
  --md-sys-typescale-label-small-line-height: 16px;
  --md-sys-typescale-label-small-weight: 500;
  --md-sys-typescale-label-small-tracking: 0.5px;

  --md-sys-shape-corner-extra-small: 4px;
  --md-sys-shape-corner-small: 8px;
  --md-sys-shape-corner-medium: 12px;
  --md-sys-shape-corner-large: 16px;
  --md-sys-shape-corner-extra-large: 28px;
  --md-sys-shape-corner-full: 9999px;

  --md-sys-elevation-level0: none;
  --md-sys-elevation-level1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
  --md-sys-elevation-level2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
  --md-sys-elevation-level3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);

  --md-sys-state-hover-opacity: 0.08;
  --md-sys-state-focus-opacity: 0.10;
  --md-sys-state-pressed-opacity: 0.10;

  --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --md-sys-motion-duration-short: 150ms;
  --md-sys-motion-duration-medium: 250ms;

  --content-max: 720px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --md-sys-color-primary: #a8c7fa;
    --md-sys-color-on-primary: #062e6f;
    --md-sys-color-primary-container: #0842a0;
    --md-sys-color-on-primary-container: #d3e3fd;
    --md-sys-color-secondary: #bec6dc;
    --md-sys-color-secondary-container: #3e4759;
    --md-sys-color-on-secondary-container: #dae2f9;
    --md-sys-color-surface: #111318;
    --md-sys-color-surface-container-low: #1a1b21;
    --md-sys-color-surface-container: #1e1f25;
    --md-sys-color-surface-container-high: #282a2f;
    --md-sys-color-on-surface: #e2e2e9;
    --md-sys-color-on-surface-variant: #c4c6d0;
    --md-sys-color-outline: #8e9099;
    --md-sys-color-outline-variant: #44474f;
    --md-sys-color-error: #ffb4ab;
    --md-sys-color-on-error: #690005;
    --md-sys-color-error-container: #93000a;
    --md-sys-color-on-error-container: #ffdad6;
    --md-sys-color-success: #7dd99a;
    --md-sys-color-success-container: #0f5223;
    --md-sys-color-on-success-container: #a6f2b5;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--app-bar-height, 120px) + 16px); scroll-padding-bottom: 16px; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--md-sys-color-surface);
  color: var(--md-sys-color-on-surface);
  font-family: var(--md-ref-typeface);
  font-size: var(--md-sys-typescale-body-large-size);
  line-height: var(--md-sys-typescale-body-large-line-height);
  letter-spacing: var(--md-sys-typescale-body-large-tracking);
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ol { margin: 0; }
button, summary { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}
.wrap { width: 100%; max-width: calc(var(--content-max) + 32px); margin-inline: auto; padding-inline: 16px; }

/* Typescale helpers */
.display-small { font-size: var(--md-sys-typescale-display-small-size); line-height: var(--md-sys-typescale-display-small-line-height); font-weight: var(--md-sys-typescale-display-small-weight); letter-spacing: var(--md-sys-typescale-display-small-tracking); }
.headline-small { font-size: var(--md-sys-typescale-headline-small-size); line-height: var(--md-sys-typescale-headline-small-line-height); font-weight: var(--md-sys-typescale-headline-small-weight); letter-spacing: var(--md-sys-typescale-headline-small-tracking); }
.title-large { font-size: var(--md-sys-typescale-title-large-size); line-height: var(--md-sys-typescale-title-large-line-height); font-weight: var(--md-sys-typescale-title-large-weight); letter-spacing: var(--md-sys-typescale-title-large-tracking); }
.title-medium { font-size: var(--md-sys-typescale-title-medium-size); line-height: var(--md-sys-typescale-title-medium-line-height); font-weight: var(--md-sys-typescale-title-medium-weight); letter-spacing: var(--md-sys-typescale-title-medium-tracking); }
.body-large { font-size: var(--md-sys-typescale-body-large-size); line-height: var(--md-sys-typescale-body-large-line-height); font-weight: var(--md-sys-typescale-body-large-weight); letter-spacing: var(--md-sys-typescale-body-large-tracking); }
.body-medium { font-size: var(--md-sys-typescale-body-medium-size); line-height: var(--md-sys-typescale-body-medium-line-height); font-weight: var(--md-sys-typescale-body-medium-weight); letter-spacing: var(--md-sys-typescale-body-medium-tracking); }
.label-large { font-size: var(--md-sys-typescale-label-large-size); line-height: var(--md-sys-typescale-label-large-line-height); font-weight: var(--md-sys-typescale-label-large-weight); letter-spacing: var(--md-sys-typescale-label-large-tracking); }
.label-medium { font-size: var(--md-sys-typescale-label-medium-size); line-height: var(--md-sys-typescale-label-medium-line-height); font-weight: var(--md-sys-typescale-label-medium-weight); letter-spacing: var(--md-sys-typescale-label-medium-tracking); }
.label-small { font-size: var(--md-sys-typescale-label-small-size); line-height: var(--md-sys-typescale-label-small-line-height); font-weight: var(--md-sys-typescale-label-small-weight); letter-spacing: var(--md-sys-typescale-label-small-tracking); }

/* Small top app bar */
.top-app-bar {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--md-sys-color-surface);
  transition: background-color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard),
              box-shadow var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
}
.top-app-bar.is-scrolled { background: var(--md-sys-color-surface-container); box-shadow: var(--md-sys-elevation-level2); }
.bar-row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding-block: 8px; }
.bar-title {
  flex: 1 1 auto; min-width: 0;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  overflow-wrap: break-word;
}
.bar-chips { display: flex; flex-wrap: wrap; gap: 8px; padding-block-end: 12px; }
@media (max-width: 599px) {
  .bar-row { min-height: 56px; }
  .bar-title { font-size: 18px; line-height: 24px; }
  .bar-row .badge, .bar-chips #chip-total { display: none; }
  .bar-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 6px; padding-block-end: 10px; margin-inline-end: -16px; padding-inline-end: 16px; }
  .bar-chips::-webkit-scrollbar { display: none; }
  .bar-chips .chip { flex: none; height: 28px; padding-inline: 8px; }
}

/* Chips (assist chip / badge) */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding-inline: 12px;
  border-radius: var(--md-sys-shape-corner-small);
  border: 1px solid var(--md-sys-color-outline-variant);
  color: var(--md-sys-color-on-surface-variant);
  white-space: nowrap;
}
.chip-tonal { border-color: transparent; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.chip-strong { color: var(--md-sys-color-on-surface); }
.badge { flex: none; }

/* Linear progress indicator (determinate) */
.progress { height: 4px; background: var(--md-sys-color-secondary-container); border-radius: var(--md-sys-shape-corner-full); overflow: hidden; }
.progress-indicator {
  height: 100%; width: 0; background: var(--md-sys-color-primary); border-radius: inherit;
  transition: width var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
}

main { flex: 1 0 auto; padding-block: 16px 32px; }
.subtitle { color: var(--md-sys-color-on-surface-variant); margin-block-end: 16px; }
.subtitle:empty { display: none; }

/* Cards */
.card { border-radius: var(--md-sys-shape-corner-large); padding: 20px; }
.card-elevated { background: var(--md-sys-color-surface-container-low); box-shadow: var(--md-sys-elevation-level1); }
@media (min-width: 600px) { .card { padding: 24px; } }
.enter { animation: enter var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard); }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.q-heading { outline: none; scroll-margin-top: calc(var(--app-bar-height, 120px) + 16px); }
.q-title { display: block; color: var(--md-sys-color-primary); margin-block-end: 4px; }
.q-text { display: block; font-weight: 400; }
@media (min-width: 600px) {
  .q-text { font-size: var(--md-sys-typescale-headline-small-size); line-height: var(--md-sys-typescale-headline-small-line-height); letter-spacing: var(--md-sys-typescale-headline-small-tracking); }
}

/* State layers */
.state { position: relative; isolation: isolate; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.state::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: currentColor; opacity: 0; pointer-events: none;
  transition: opacity var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}
@media (hover: hover) { .state:hover:not(:disabled)::before { opacity: var(--md-sys-state-hover-opacity); } }
.state:focus-visible:not(:disabled)::before { opacity: var(--md-sys-state-focus-opacity); }
.state:active:not(:disabled)::before { opacity: var(--md-sys-state-pressed-opacity); }
.state:focus-visible { outline: 3px solid var(--md-sys-color-secondary); outline-offset: 2px; }

/* Options: outlined cards as buttons */
.options { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 12px; }
.option {
  width: 100%; min-height: 56px; min-width: 48px;
  display: flex; align-items: center; gap: 16px;
  padding-block: 12px; padding-inline: 12px 16px;
  text-align: start;
  background: transparent;
  color: var(--md-sys-color-on-surface);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-sys-shape-corner-medium);
  transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
              border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}
.option-num {
  flex: none; display: inline-grid; place-items: center;
  width: 32px; height: 32px; border-radius: var(--md-sys-shape-corner-full);
  background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
}
.option-text { flex: 1 1 auto; min-width: 0; }
.option-icon { flex: none; width: 24px; height: 24px; display: none; }
.option-icon svg, .icon svg { display: block; width: 100%; height: 100%; fill: currentColor; }
.option:disabled { cursor: default; }
.option:disabled:not(.is-correct):not(.is-wrong) > * { opacity: 0.38; }
.option.is-correct { background: var(--md-sys-color-success-container); color: var(--md-sys-color-on-success-container); border: 2px solid var(--md-sys-color-success); padding-block: 11px; padding-inline: 11px 15px; }
.option.is-wrong { background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); border: 2px solid var(--md-sys-color-error); padding-block: 11px; padding-inline: 11px 15px; }
.option.is-correct .option-num { background: var(--md-sys-color-success); color: var(--md-sys-color-success-container); }
.option.is-wrong .option-num { background: var(--md-sys-color-error); color: var(--md-sys-color-error-container); }
.option.is-correct .option-icon, .option.is-wrong .option-icon { display: block; }

.kbd-hint { margin-block-start: 12px; color: var(--md-sys-color-on-surface-variant); }
@media (hover: none) { .kbd-hint { display: none; } }

/* Feedback: filled card inside a persistent live region */
.feedback-region:not(:empty) { margin-block-start: 16px; }
.feedback {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 16px; border-radius: var(--md-sys-shape-corner-medium);
}
.feedback.is-correct { background: var(--md-sys-color-success-container); color: var(--md-sys-color-on-success-container); }
.feedback.is-wrong { background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
.icon { flex: none; width: 24px; height: 24px; }
.feedback-body { display: grid; gap: 4px; min-width: 0; }

/* Buttons */
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-block-start: 20px; }
.actions .spacer { flex: 1 1 auto; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; min-width: 48px; padding-inline: 24px;
  border: 0; border-radius: var(--md-sys-shape-corner-full);
  text-align: center;
  font-size: var(--md-sys-typescale-label-large-size); line-height: var(--md-sys-typescale-label-large-line-height);
  font-weight: var(--md-sys-typescale-label-large-weight); letter-spacing: var(--md-sys-typescale-label-large-tracking);
  transition: box-shadow var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}
.btn-filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
@media (hover: hover) { .btn-filled:hover:not(:disabled) { box-shadow: var(--md-sys-elevation-level1); } }
.btn-tonal { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.btn-outlined { background: transparent; color: var(--md-sys-color-primary); border: 1px solid var(--md-sys-color-outline); }
.btn-text { background: transparent; color: var(--md-sys-color-primary); padding-inline: 12px; }
.btn:disabled { cursor: default; background: transparent; color: var(--md-sys-color-on-surface); box-shadow: none; }
.btn:disabled > * { opacity: 0.38; }
.btn-filled:disabled::after, .btn-tonal:disabled::after {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--md-sys-color-on-surface); opacity: 0.12;
}
@media (max-width: 599px) {
  .actions .btn { flex: 1 1 auto; padding-inline: 16px; }
  .actions .spacer { display: none; }
}

/* Result */
.result { text-align: center; }
.result-title { outline: none; width: fit-content; margin-inline: auto; padding-inline: 8px; }
.result-percent { color: var(--md-sys-color-primary); margin-block: 16px 4px; }
.result-comment { color: var(--md-sys-color-on-surface-variant); margin-block-start: 8px; }
.result .actions { justify-content: center; }

.review { margin-block-start: 16px; text-align: start; }
.review > summary {
  list-style: none; display: flex; width: fit-content; margin-inline: auto;
  align-items: center; border-radius: var(--md-sys-shape-corner-full);
}
.review > summary::-webkit-details-marker { display: none; }
.review > summary .chevron { width: 18px; height: 18px; transition: transform var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard); }
.review[open] > summary .chevron { transform: rotate(180deg); }
.review-list { padding: 0; margin: 16px 0 0; list-style: none; display: grid; gap: 12px; counter-reset: review; }
.review-item {
  counter-increment: review;
  border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-sys-shape-corner-medium);
  padding: 16px; display: grid; gap: 8px;
}
.review-head { display: flex; gap: 12px; align-items: baseline; }
.review-head::before { content: counter(review); flex: none; min-width: 24px; color: var(--md-sys-color-on-surface-variant); font-size: var(--md-sys-typescale-label-large-size); font-weight: 500; }
.review-head > div { min-width: 0; }
.review-answer { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: var(--md-sys-shape-corner-small); }
.review-answer.is-correct { background: var(--md-sys-color-success-container); color: var(--md-sys-color-on-success-container); }
.review-answer.is-wrong { background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
.review-answer .icon { width: 20px; height: 20px; margin-block-start: 2px; }
.review-answer-label { display: block; }
.muted { color: var(--md-sys-color-on-surface-variant); }

footer { padding-block: 16px 24px; color: var(--md-sys-color-on-surface-variant); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<header class="top-app-bar" id="app-bar">
  <div class="wrap">
    <div class="bar-row">
      <h1 class="bar-title title-large">Когнітивні технології: концепція впровадження</h1>
      <span class="chip chip-tonal badge label-medium" data-string="badge"></span>
    </div>
    <div class="bar-chips label-medium">
      <span class="chip chip-strong" id="chip-counter"></span>
      <span class="chip" id="chip-score"></span>
      <span class="chip" id="chip-answered"></span>
      <span class="chip" id="chip-total"></span>
    </div>
  </div>
  <div class="wrap">
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="progress-indicator" id="progress-indicator"></div>
    </div>
  </div>
</header>

<main class="wrap">

<script type="application/json" id="quiz-data">[{"title": "Дві опори", "question": "На яких двох опорах, згідно з концепцією, тримається впровадження когнітивних технологій?", "options": ["На централізованому ІТ-відділі та єдиній корпоративній платформі ШІ", "На людині, яка хоче і вміє працювати по-новому, та на технологіях", "На бюджеті для ліцензій ШІ та на зовнішніх консультантах з автоматизації"], "correct": 1, "feedback": "Концепція описує системне посилення людини: перша опора — мотивована людина з новими навичками, друга — агенти ШІ та інструменти, які виконують і прискорюють роботу."}, {"title": "Однакові умови", "question": "Двоє співробітників отримали однакове завдання й однакові ресурси, але результати в них суттєво різні. На що, згідно з першим прикладом, керівнику варто звернути увагу насамперед?", "options": ["На різницю в доступних ресурсах і термінах виконання", "На чіткість інструкції, яку отримав кожен співробітник", "На те, як кожен сприймає завдання і свою роль у ньому"], "correct": 2, "feedback": "Умови однакові, тому різниця походить від сприйняття: один бачить нав’язану роботу, інший — можливість вплинути. Від цього залежать мотивація, поведінка і результат."}, {"title": "Звіт чи рішення", "question": "Обидва менеджери мали доступ до того самого агента ШІ. Чому другий отримав рішення, а не лише звіт?", "options": ["Бо делегував рутину агенту, а звільнений час витратив на розмови з клієнтами", "Бо мав доступ до потужнішої версії агента, ніж перший менеджер", "Бо доручив агенту і аналіз, і висновки, а сам лише надіслав звіт"], "correct": 0, "feedback": "Інструмент був однаковий. Різницю дало мислення: другий менеджер передав агенту рутину і спрямував звільнений час на те, що потребує людини, — розмови з клієнтами й пропозиції змін."}, {"title": "Помилка агента", "question": "Агент об’єднав дві різні проблеми клієнтів в одну, і менеджер це помітив. Який висновок для роботи з агентами випливає з цього прикладу?", "options": ["Аналіз скарг краще р діляє роботу між собою і агентом, а не додає ШІ наприкінці."}, {"title": "Критичне мислення", "question": "Чому серед когнітивних навичок концепція називає перевірку результатів ШІ і роботу з когнітивними викривленнями?", "options": ["Бо людина відповідає за результат і має критично оцінювати роботу агента", "Бо так співробітник швидше переходить до роботи з командою агентів", "Бо ці навички замінюють потребу в базі знань і даних компанії"], "correct": 0, "feedback": "Агент виконує, але відповідальність лишається за людиною. Тому їй потрібні навички, які допомагають помітити помилку ШІ і власне упередження."}, {"title": "Доказ ефекту", "question": "Керівник хоче показати, що пілот з агентом для обробки заявок справді працює. Який підхід відповідає концепції?", "options": ["Порахувати, скільки годин співробітники провели в інструменті ШІ", "Зібрати відгуки про те, наскільки інструмент сподобався команді", "Порівняти час на задачу, якість і кількість помилок до і після запуску"], "correct": 2, "feedback": "Концепція оцінює результат, а не витрачені години. Порівняння ключових показників до і після впровадження показує реальний ефект."}, {"title": "Рівень ШІ", "question": "Система щодня сама приймає заявки клієнтів, сортує їх і готує відповіді, виконуючи процес від початку до кінця. Який це рівень використання ШІ?", "options": ["Помічник", "Співвиконавець", "Агент"], "correct": 2, "feedback": "Агент самостійно веде весь процес від початку до кінця. Помічник лише підказує, а співвиконавець робить частину задачі, яку перевіряє людина."}, {"title": "Загальні відповіді", "question": "Агент відповідає клієнтам загальними фразами і не враховує правил компанії. Чого, найімовірніше, бракує?", "options": ["Аналітики й дашбордів, які вимірюють ефект роботи агента", "Бази знань, щоб агент працював на даних самої компанії", "Тригерів, які запускають регламентні задачі за розкладом"], "correct": 1, "feedback": "База знань дає агенту доступ до даних і правил компанії. Без неї він спирається лише на загальні знання моделі."}, {"title": "Старт впровадження", "question": "Компанія хоче одразу автоматизувати всі 40 своїх процесів. Що радить концепція?", "options": ["Почати з 2–3 процесів, де багато рутини і результат легко виміряти", "Почати з найскладнішого процесу, щоб одразу показати великий ефект", "Запустити всі процеси паралельно, а неефективні вимкнути згодом"], "correct": 0, "feedback": "Малий старт на рутинних і вимірюваних процесах швидко дає доказ ефекту. Масштабувати варто лише те, що довело свою користь цифрами."}, {"title": "Людина в контурі", "question": "Що означає принцип «людина в контурі»?", "options": ["Людина виконує роботу, а агент лише фіксує її хід для звітності", "Агент виконує, а людина ставить мету, перевіряє й відповідає за результат", "Агент працює сам, а людина раз на місяць отримує підсумковий звіт"], "correct": 1, "feedback": "Принцип розподіляє ролі: виконання делеговано агенту, а мета, контроль якості й відповідальність лишаються за людиною."}]</script>
<script type="application/json" id="quiz-strings">{"badge": "Інтерактивний квіз", "questionCounter": "Питання {current} з {total}", "scoreLabel": "Бали: {score}", "totalLabel": "Питань: {total}", "answeredLabel": "Відповіли: {answered}", "progressLabel": "Прогрес квізу", "optionAria": "Варіант {n}: {text}", "next": "Наступне питання", "showResult": "Показати результат", "correct": "Правильно", "incorrect": "Неправильно", "correctMark": "правильна відповідь", "incorrectMark": "ваша відповідь, неправильна", "correctAnswerIs": "Правильна відповідь: {answer}", "feedbackRegion": "Пояснення до відповіді", "keyboardHint": "Клавіші 1–{max} — вибір відповіді, Enter — далі", "resultTitle": "Результат", "resultSummary": "Правильних відповідей: {score} з {total}", "comment90": "Відмінний результат! Матеріал засвоєно впевнено.", "comment70": "Добрий результат. Перегляньте питання з помилками.", "comment50": "Непогано, але варто ще попрактикуватися.", "commentLow": "Радимо повторити матеріал і пройти квіз ще раз.", "restart": "Пройти ще раз", "restartDuring": "Почати спочатку", "reviewToggle": "Переглянути відповіді", "reviewYourAnswer": "Ваша відповідь", "reviewCorrectAnswer": "Правильна відповідь", "quizRegion": "Питання квізу", "resultRegion": "Результат квізу", "footer": "Офлайн-квіз в одному файлі"}</script>
<script>
(function () {
  'use strict';

  var questions = JSON.parse(document.getElementById('quiz-data').textContent);
  var S = JSON.parse(document.getElementById('quiz-strings').textContent);

  function $(id) { return document.getElementById(id); }
  function fill(key, vars) {
    var text = String(S[key] == null ? '' : S[key]);
    Object.keys(vars || {}).forEach(function (name) {
      text = text.split('{' + name + '}').join(String(vars[name]));
    });
    return text;
  }
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  var iconTemplate = $('icons').content;
  function icon(name, className) {
    var wrap = el('span', className || 'icon');
    wrap.setAttribute('aria-hidden', 'true');
    wrap.appendChild(iconTemplate.querySelector('[data-name="' + name + '"]').cloneNode(true));
    return wrap;
  }
  function restartAnimation(node) {
    node.classList.remove('enter');
    void node.offsetWidth;
    node.classList.add('enter');
  }

  var ui = {
    appBar: $('app-bar'),
    counter: $('chip-counter'), score: $('chip-score'), answered: $('chip-answered'), total: $('chip-total'),
    progress: $('progress'), progressIndicator: $('progress-indicator'),
    quiz: $('quiz'), card: $('q-card'), heading: $('q-heading'), title: $('q-title'), text: $('q-text'),
    options: $('options'), hint: $('kbd-hint'), feedback: $('feedback'),
    next: $('btn-next'), nextLabel: $('btn-next-label'), restartDuring: $('btn-restart-during'),
    result: $('result'), resultTitle: $('result-title'), percent: $('result-percent'),
    summary: $('result-summary'), comment: $('result-comment'), restart: $('btn-restart'),
    review: $('review'), reviewList: $('review-list')
  };

  var total = questions.length;
  var state;

  function reset() {
    state = { index: 0, score: 0, answers: new Array(total).fill(null) };
  }

  function answeredCount() {
    return state.answers.filter(function (a) { return a !== null; }).length;
  }

  function applyStaticStrings() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-string]'), function (node) {
      node.textContent = fill(node.getAttribute('data-string'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-icon]'), function (node) {
      node.appendChild(iconTemplate.querySelector('[data-name="' + node.getAttribute('data-icon') + '"]').cloneNode(true));
    });
    ui.quiz.setAttribute('aria-label', fill('quizRegion'));
    ui.quiz.removeAttribute('aria-labelledby');
    ui.result.setAttribute('aria-label', fill('resultRegion'));
    ui.progress.setAttribute('aria-label', fill('progressLabel'));
    ui.progress.setAttribute('aria-valuemax', String(total));
    ui.feedback.setAttribute('aria-label', fill('feedbackRegion'));
  }

  function updateStatus() {
    var answered = answeredCount();
    ui.counter.textContent = fill('questionCounter', { current: Math.min(state.index + 1, total), total: total });
    ui.score.textContent = fill('scoreLabel', { score: state.score });
    ui.answered.textContent = fill('answeredLabel', { answered: answered });
    ui.total.textContent = fill('totalLabel', { total: total });
    ui.progress.setAttribute('aria-valuenow', String(answered));
    ui.progressIndicator.style.width = (total ? (answered / total) * 100 : 0) + '%';
  }

  function optionButtons() {
    return Array.prototype.slice.call(ui.options.querySelectorAll('.option'));
  }

  function renderQuestion() {
    var q = questions[state.index];
    ui.title.textContent = q.title;
    ui.text.textContent = q.question;
    ui.options.textContent = '';
    q.options.forEach(function (optionText, i) {
      var item = el('li');
      var button = el('button', 'option state body-large');
      button.type = 'button';
      var ariaParts = String(S.optionAria == null ? '' : S.optionAria).split('{text}');
      var num = el('span', 'option-num label-large', String(i + 1));
      num.setAttribute('aria-hidden', 'true');
      button.appendChild(num);
      button.appendChild(el('span', 'sr-only', ariaParts[0].split('{n}').join(String(i + 1))));
      button.appendChild(el('span', 'option-text', optionText));
      button.appendChild(el('span', 'sr-only', ariaParts.slice(1).join(optionText).split('{n}').join(String(i + 1))));
      button.appendChild(el('span', 'option-mark sr-only'));
      button.addEventListener('click', function () { choose(i); });
      item.appendChild(button);
      ui.options.appendChild(item);
    });
    ui.hint.textContent = fill('keyboardHint', { max: q.options.length });
    ui.feedback.textContent = '';
    ui.next.disabled = true;
    ui.nextLabel.textContent = fill(state.index === total - 1 ? 'showResult' : 'next');
    updateStatus();
    restartAnimation(ui.card);
  }

  function markOption(button, kind) {
    var isCorrect = kind === 'correct';
    button.classList.add(isCorrect ? 'is-correct' : 'is-wrong');
    button.appendChild(icon(isCorrect ? 'check' : 'close', 'option-icon'));
    var mark = fill(isCorrect ? 'correctMark' : 'incorrectMark');
    button.querySelector('.option-mark').textContent = ' (' + mark + ')';
  }

  function choose(choice) {
    if (state.answers[state.index] !== null) return;
    var q = questions[state.index];
    var right = choice === q.correct;
    state.answers[state.index] = choice;
    if (right) state.score += 1;

    var buttons = optionButtons();
    buttons.forEach(function (button) { button.disabled = true; });
    markOption(buttons[q.correct], 'correct');
    if (!right) markOption(buttons[choice], 'wrong');

    var card = el('div', 'feedback ' + (right ? 'is-correct' : 'is-wrong'));
    card.appendChild(icon(right ? 'check' : 'close'));
    var body = el('div', 'feedback-body body-medium');
    body.appendChild(el('strong', 'title-medium', fill(right ? 'correct' : 'incorrect')));
    if (!right) body.appendChild(el('p', null, fill('correctAnswerIs', { answer: q.options[q.correct] })));
    body.appendChild(el('p', null, q.feedback));
    card.appendChild(body);
    ui.feedback.appendChild(card);

    ui.next.disabled = false;
    updateStatus();
    ui.next.focus({ preventScroll: true });
    revealFeedback([buttons[q.correct], buttons[choice]]);
  }

  function syncBarHeight() {
    document.documentElement.style.setProperty('--app-bar-height', ui.appBar.offsetHeight + 'px');
  }

  function revealFeedback(marked) {
    var anchorTop = Math.min.apply(null, marked.map(function (b) { return b.getBoundingClientRect().top; }));
    var limit = anchorTop - ui.appBar.offsetHeight - 16;
    var needed = Math.max(0, ui.next.getBoundingClientRect().bottom + 16 - window.innerHeight);
    var delta = Math.min(needed, limit);
    if (delta) window.scrollBy(0, delta);
  }

  function scrollToCard() {
    var top = ui.quiz.getBoundingClientRect().top;
    var barHeight = ui.appBar.offsetHeight;
    if (top < barHeight) window.scrollBy(0, top - barHeight - 16);
  }

  function goNext() {
    if (state.answers[state.index] === null) return;
    if (state.index < total - 1) {
      state.index += 1;
      renderQuestion();
      scrollToCard();
      ui.heading.focus({ preventScroll: true });
    } else {
      showResult();
    }
  }

  function commentKey(percent) {
    if (percent >= 90) return 'comment90';
    if (percent >= 70) return 'comment70';
    if (percent >= 50) return 'comment50';
    return 'commentLow';
  }

  function reviewAnswer(label, text, correct) {
    var row = el('div', 'review-answer ' + (correct ? 'is-correct' : 'is-wrong'));
    row.appendChild(icon(correct ? 'check' : 'close'));
    var body = el('div', 'body-medium');
    body.appendChild(el('span', 'review-answer-label label-medium', label));
    body.appendChild(document.createTextNode(text));
    body.appendChild(el('span', 'sr-only', ' (' + fill(correct ? 'correctMark' : 'incorrectMark') + ')'));
    row.appendChild(body);
    return row;
  }

  function renderReview() {
    ui.reviewList.textContent = '';
    questions.forEach(function (q, i) {
      var choice = state.answers[i];
      var right = choice === q.correct;
      var item = el('li', 'review-item');
      var head = el('div', 'review-head');
      var headText = el('div');
      headText.appendChild(el('h3', 'title-medium', q.title));
      headText.appendChild(el('p', 'body-medium muted', q.question));
      head.appendChild(headText);
      item.appendChild(head);
      if (choice !== null) item.appendChild(reviewAnswer(fill('reviewYourAnswer'), q.options[choice], right));
      if (!right) item.appendChild(reviewAnswer(fill('reviewCorrectAnswer'), q.options[q.correct], true));
      item.appendChild(el('p', 'body-medium', q.feedback));
      ui.reviewList.appendChild(item);
    });
  }

  function showResult() {
    var percent = total ? Math.round((state.score / total) * 100) : 0;
    ui.percent.textContent = percent + '%';
    ui.summary.textContent = fill('resultSummary', { score: state.score, total: total });
    ui.comment.textContent = fill(commentKey(percent));
    renderReview();
    ui.review.open = false;
    ui.quiz.hidden = true;
    ui.result.hidden = false;
    restartAnimation(ui.result.firstElementChild);
    window.scrollTo(0, 0);
    ui.resultTitle.focus({ preventScroll: true });
  }

  function restart() {
    reset();
    ui.result.hidden = true;
    ui.quiz.hidden = false;
    ui.review.open = false;
    renderQuestion();
    window.scrollTo(0, 0);
    ui.heading.focus({ preventScroll: true });
  }

  document.addEventListener('keydown', function (event) {
    if (event.ctrlKey || event.metaKey || event.altKey || ui.quiz.hidden) return;
    var buttons = optionButtons();
    if (/^[1-9]$/.test(event.key)) {
      var n = Number(event.key) - 1;
      if (n < buttons.length && state.answers[state.index] === null) {
        event.preventDefault();
        choose(n);
      }
      return;
    }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      var enabled = buttons.filter(function (b) { return !b.disabled; });
      var current = enabled.indexOf(document.activeElement);
      if (!enabled.length || (current === -1 && !ui.card.contains(document.activeElement))) return;
      event.preventDefault();
      var step = event.key === 'ArrowDown' ? 1 : -1;
      var target = current === -1 ? (step > 0 ? 0 : enabled.length - 1) : (current + step + enabled.length) % enabled.length;
      enabled[target].focus();
    }
  });

  ui.next.addEventListener('click', goNext);
  ui.restartDuring.addEventListener('click', restart);
  ui.restart.addEventListener('click', restart);

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () {
      ui.appBar.classList.toggle('is-scrolled', window.scrollY > 0);
      ticking = false;
    });
  }, { passive: true });

  window.addEventListener('resize', syncBarHeight);

  applyStaticStrings();
  reset();
  renderQuestion();
  syncBarHeight();
})();
</script>
</body>
</html>
